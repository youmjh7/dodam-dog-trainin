    function calculateKmFromBugok(addressStr) {
      if (!addressStr || addressStr.trim() === '') return 5;
      const addr = addressStr.toLowerCase();

      if (addr.includes('안산')) return 6;
      if (addr.includes('군포') || addr.includes('의왕')) return 11;

      if (addr.includes('성남') || addr.includes('분당')) return 33;
      if (addr.includes('고양') || addr.includes('파주') || addr.includes('남양주')) return 50;
      return 25;

          recognition.maxAlternatives = 1;

          recognition.onresult = (event) => {

                          />
                        </div>

                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '10px' }}>
                          <div className="form-group">
                            <label style={{ display: 'block', color: 'var(--text-muted)', fontSize: '0.82rem', marginBottom: '4px' }}>견종</label>
                            <select
                              value={authForm.dogBreed}
                              onChange={e => setAuthForm({ ...authForm, dogBreed: e.target.value })}
                              style={{ width: '100%', padding: '9px 12px', background: '#151D2C', border: '1px solid var(--border-color)', color: '#FFF', borderRadius: '8px' }}
                            >
                              <option value="포메라니안">포메라니안</option>
                              <option value="말티즈">말티즈</option>
                              <option value="토이푸들">토이푸들</option>
                              <option value="비숑 프리제">비숑 프리제</option>
                              <option value="시바견">시바견</option>
                              <option value="진돗개">진돗개</option>
                              <option value="믹스견">믹스견</option>
                            </select>
                          </div>
                          <div className="form-group">
                            <label style={{ display: 'block', color: 'var(--text-muted)', fontSize: '0.82rem', marginBottom: '4px' }}>나이 (살)</label>
                            <input
                              type="number"
                              placeholder="예: 2"
                              value={authForm.dogAge}
                              onChange={e => setAuthForm({ ...authForm, dogAge: e.target.value })}
                              style={{ width: '100%', padding: '9px 12px', background: '#151D2C', border: '1px solid var(--border-color)', color: '#FFF', borderRadius: '8px' }}
                            />
                          </div>
                        </div>

                        <div className="form-group" style={{ marginBottom: '10px' }}>
                          <label style={{ display: 'block', color: 'var(--text-muted)', fontSize: '0.82rem', marginBottom: '4px' }}>
                            🐕 고치고 싶은 문제 행동 (상세 작성)
                          </label>
                          <textarea
                            placeholder="예: 현관 도어벨 및 발자국 소리에 심하게 짖음, 외부인 경계, 산책 시 목줄 당김, 분리불안 등"
                            value={authForm.problemBehavior || ''}
                            onChange={e => setAuthForm({ ...authForm, problemBehavior: e.target.value })}
                            style={{ width: '100%', padding: '9px 12px', background: '#151D2C', border: '1px solid var(--border-color)', color: '#FFF', borderRadius: '8px', minHeight: '60px', fontSize: '0.85rem' }}
                          />
                        </div>

                        <div style={{ display: 'flex', gap: '8px', marginTop: '14px' }}>
                          <button className="btn btn-secondary" type="button" onClick={() => setAuthStep(1)}>◀ 이전</button>
                          <button className="btn btn-primary" style={{ flex: 1 }} type="submit">다음 단계: 약관 동의 ➔</button>
                        </div>
                      </form>
                    )}

                    {authStep === 3 && (
                      <form onSubmit={(e) => {
                        e.preventDefault();
                        if (!authForm.agreeTerms || !authForm.agreePrivacy) {
                          alert('필수 약관에 동의해 주세요.');
                          return;
                        }
                        const newM = {
                          id: `m-${Date.now()}`,
                          name: authForm.name || '신규 보호자',
                          email: authForm.email,
                          phone: authForm.phone || '010-0000-0000',
                          petName: authForm.dogName || '강아지',
                          breed: authForm.dogBreed || '포메라니안',
                          completedSessions: 0,
                          address: '주소 미입력',
                          memo: authForm.problemBehavior ? `[가입 시 작성 문제행동] ${authForm.problemBehavior}` : '신규 회원가입 완료',
                          problemBehavior: authForm.problemBehavior || '',
                          joinDate: new Date().toISOString().split('T')[0]
                        };
                        setMembers(prev => [newM, ...prev]);
                        setUser({
                          name: newM.name,
                          email: newM.email,
                          isLoggedIn: true
                        });
                        alert(`🎉 [회원가입 성공!]\n${newM.name}님 환영합니다!`);
                        setShowAuthModal(false);
                      }}>
                        <div style={{ background: 'rgba(255,255,255,0.03)', border: '1px solid var(--border-color)', padding: '12px', borderRadius: '8px', marginBottom: '14px', display: 'flex', flexDirection: 'column', gap: '8px', fontSize: '0.82rem' }}>
                          <label style={{ display: 'flex', alignItems: 'center', gap: '8px', color: '#FFF', fontWeight: 'bold' }}>
                            <input
                              type="checkbox"
                              checked={authForm.agreeTerms && authForm.agreePrivacy}
                              onChange={(e) => setAuthForm({ ...authForm, agreeTerms: e.target.checked, agreePrivacy: e.target.checked })}
                            />
                            <span>전체 약관 동의</span>
                          </label>
                          <div style={{ height: '1px', background: 'var(--border-color)' }}></div>
                          <label style={{ display: 'flex', alignItems: 'center', gap: '8px', color: 'var(--text-muted)' }}>
                            <input
                              type="checkbox"
                              checked={authForm.agreeTerms}
                              onChange={(e) => setAuthForm({ ...authForm, agreeTerms: e.target.checked })}
                              required
                            />
                            <span>[필수] 도담 서비스 이용약관 동의</span>
                          </label>
                          <label style={{ display: 'flex', alignItems: 'center', gap: '8px', color: 'var(--text-muted)' }}>
                            <input
                              type="checkbox"
                              checked={authForm.agreePrivacy}
                              onChange={(e) => setAuthForm({ ...authForm, agreePrivacy: e.target.checked })}
                              required
                            />
                            <span>[필수] 개인정보 수집 및 이용 동의</span>
                          </label>
                        </div>

                        <div style={{ display: 'flex', gap: '8px' }}>
                          <button className="btn btn-secondary" type="button" onClick={() => setAuthStep(2)}>◀ 이전</button>
                          <button className="btn btn-primary btn-lg" style={{ flex: 1 }} type="submit">🎉 회원가입 완료하기</button>
                        </div>
                      </form>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
