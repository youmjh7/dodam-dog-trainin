    function calculateKmFromBugok(addressStr) {
      if (!addressStr || addressStr.trim() === '') return 5;
      const addr = addressStr.toLowerCase();
      if (addr.includes('부곡동')) return 1;
      if (addr.includes('안산')) return 6;
      if (addr.includes('군포') || addr.includes('의왕')) return 11;
      if (addr.includes('시흥') || addr.includes('안양')) return 13;
      if (addr.includes('수원') || addr.includes('화성')) return 19;
      if (addr.includes('부천') || addr.includes('광명')) return 23;
      if (addr.includes('인천') || addr.includes('용인')) return 31;
      if (addr.includes('서울') || addr.includes('강남') || addr.includes('서초') || addr.includes('마포') || addr.includes('송파')) return 36;
      if (addr.includes('성남') || addr.includes('분당')) return 33;
      if (addr.includes('고양') || addr.includes('파주') || addr.includes('남양주')) return 50;
      return 25;
    }

      const [activePet, setActivePet] = useState(initialPets[0]);
      const [user, setUser] = useState({ name: '김보호자', email: 'user@pawcoach.kr', isLoggedIn: true });
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authTab, setAuthTab] = useState('signup');
      const [authStep, setAuthStep] = useState(1);
      const [authForm, setAuthForm] = useState({ name: '', email: '', password: '', confirmPassword: '', phone: '', dogName: '', dogBreed: '포메라니안', dogAge: '2', agreeTerms: false, agreePrivacy: false });

      // Calendar & Booking State (하루 오전 1팀, 오후 1팀 제한)
      const [selectedSessionCount, setSelectedSessionCount] = useState(1);
      const [targetAddress, setTargetAddress] = useState('경기도 안산시 상록구 부곡동 123');
      const [calculatedKm, setCalculatedKm] = useState(1);
      const [calendarMonth, setCalendarMonth] = useState(9); // 9월 or 10월
      const [selectedDate, setSelectedDate] = useState('2026-09-24');
      const [selectedTimeSlot, setSelectedTimeSlot] = useState('14:00 - 15:30');

      // 관리자 달력 일정 수정 모드 State & 휴대폰 SMS 인증번호 / 비밀번호 (@4865) 보안
      const [isAdminMode, setIsAdminMode] = useState(false);
      const [adminEditDate, setAdminEditDate] = useState(null);
      const [showAdminPwModal, setShowAdminPwModal] = useState(false);
      const [adminPwInput, setAdminPwInput] = useState('');

      // 휴대폰 SMS 인증번호 State
      const [adminAuthTab, setAdminAuthTab] = useState('sms'); // 'sms' or 'pw'
      const [adminPhone, setAdminPhone] = useState('010-1234-5678');

        if (isAdminMode) {

      // 회원 수료 횟수 변경 함수
      const handleUpdateCompletedSessions = (memberId, delta) => {

                    <p style={{ color: 'var(--text-muted)', fontSize: '0.8rem', margin: '4px 0 0 0' }}>
                      회원별 훈련 수료 횟수(completedSessions)를 직접 조정하거나 메모를 저장할 수 있습니다.
                    </p>
                  </div>
                  <button onClick={() => setShowAdminMemberModal(false)} style={{ background: 'none', border: 'none', color: 'var(--text-muted)', fontSize: '1.4rem', cursor: 'pointer' }}>✕</button>
                </div>

                {/* Search & Actions Bar */}
                <div style={{ display: 'flex', gap: '10px', marginBottom: '16px' }}>
                  <input
                    type="text"
                    placeholder="🔍 회원 이름, 강아지 이름, 전화번호 검색..."
                    value={memberSearchQuery}
                    onChange={e => setMemberSearchQuery(e.target.value)}
                    style={{ flex: 1, padding: '10px 14px', background: '#151D2C', border: '1px solid var(--border-color)', color: '#FFF', borderRadius: '8px', fontSize: '0.88rem' }}
                  />
                  <button
                    className="btn btn-primary btn-sm"
                    onClick={() => setShowAddMemberForm(!showAddMemberForm)}
                  >
                    {showAddMemberForm ? '✕ 폼 닫기' : '➕ 신규 회원 등록'}
                  </button>
                </div>

                {/* Add Member Form */}
                {showAddMemberForm && (
                  <form onSubmit={handleAddMemberSubmit} style={{ background: '#1E293B', padding: '16px', borderRadius: '12px', marginBottom: '20px', border: '1px solid #3B82F6' }}>
                    <h4 style={{ color: '#60A5FA', margin: '0 0 12px 0', fontSize: '1rem' }}>📝 신규 회원 수동 등록</h4>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '10px' }}>
                      <input type="text" placeholder="보호자 이름 *" value={newMemberForm.name} onChange={e => setNewMemberForm({ ...newMemberForm, name: e.target.value })} style={{ padding: '8px 10px', background: '#0F172A', border: '1px solid var(--border-color)', color: '#FFF', borderRadius: '6px' }} required />
                      <input type="text" placeholder="전화번호 (010-0000-0000)" value={newMemberForm.phone} onChange={e => setNewMemberForm({ ...newMemberForm, phone: e.target.value })} style={{ padding: '8px 10px', background: '#0F172A', border: '1px solid var(--border-color)', color: '#FFF', borderRadius: '6px' }} />
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '10px' }}>
                      <input type="text" placeholder="반려견 이름 *" value={newMemberForm.petName} onChange={e => setNewMemberForm({ ...newMemberForm, petName: e.target.value })} style={{ padding: '8px 10px', background: '#0F172A', border: '1px solid var(--border-color)', color: '#FFF', borderRadius: '6px' }} required />
                      <input type="text" placeholder="견종 (예: 포메라니안)" value={newMemberForm.breed} onChange={e => setNewMemberForm({ ...newMemberForm, breed: e.target.value })} style={{ padding: '8px 10px', background: '#0F172A', border: '1px solid var(--border-color)', color: '#FFF', borderRadius: '6px' }} />
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '10px' }}>
                      <input type="email" placeholder="이메일" value={newMemberForm.email} onChange={e => setNewMemberForm({ ...newMemberForm, email: e.target.value })} style={{ padding: '8px 10px', background: '#0F172A', border: '1px solid var(--border-color)', color: '#FFF', borderRadius: '6px' }} />
                      <input type="number" placeholder="초기 수료 횟수 (기본 0)" value={newMemberForm.completedSessions} onChange={e => setNewMemberForm({ ...newMemberForm, completedSessions: e.target.value })} style={{ padding: '8px 10px', background: '#0F172A', border: '1px solid var(--border-color)', color: '#FFF', borderRadius: '6px' }} />
                    </div>
                    <input type="text" placeholder="자택 상세 주소" value={newMemberForm.address} onChange={e => setNewMemberForm({ ...newMemberForm, address: e.target.value })} style={{ width: '100%', padding: '8px 10px', background: '#0F172A', border: '1px solid var(--border-color)', color: '#FFF', borderRadius: '6px', marginBottom: '10px' }} />
                    <input type="text" placeholder="관리자 특이사항 메모" value={newMemberForm.memo} onChange={e => setNewMemberForm({ ...newMemberForm, memo: e.target.value })} style={{ width: '100%', padding: '8px 10px', background: '#0F172A', border: '1px solid var(--border-color)', color: '#FFF', borderRadius: '6px', marginBottom: '12px' }} />
                    <button type="submit" className="btn btn-primary btn-full">등록 완료</button>
                  </form>
                )}

                {/* Member List */}
                <div style={{ display: 'flex', flexDirection: 'column', gap: '14px', maxHeight: '55vh', overflowY: 'auto' }}>
                  {members
                    .filter(m => {
                      if (!memberSearchQuery) return true;
                      const q = memberSearchQuery.toLowerCase();
                      return m.name.toLowerCase().includes(q) || m.petName.toLowerCase().includes(q) || (m.phone && m.phone.includes(q)) || (m.breed && m.breed.toLowerCase().includes(q));
                    })
                    .map(m => {
                      const isVip = m.completedSessions >= 1;
                      return (
                        <div key={m.id} style={{ background: '#1E293B', border: isVip ? '1px solid #10B981' : '1px solid var(--border-color)', borderRadius: '12px', padding: '16px' }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px', borderBottom: '1px dashed var(--border-color)', paddingBottom: '8px' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                              <strong style={{ color: '#FFF', fontSize: '1.05rem' }}>👤 {m.name}</strong>
                              <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>가입일: {m.joinDate}</span>
                            </div>
                            <span className={`badge ${isVip ? 'badge-green' : 'badge-purple'}`} style={{ fontSize: '0.78rem' }}>
                              {isVip ? `🎁 수료견 (회당 15만원 자동 할인)` : `🌱 첫 훈련 대상 (회당 20만원)`}
                            </span>
                          </div>

                          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', fontSize: '0.85rem', color: '#E2E8F0', marginBottom: '12px' }}>
                            <div>🐶 <strong>반려견:</strong> {m.petName} ({m.breed || '품종미상'})</div>
                            <div>📞 <strong>연락처:</strong> {m.phone || '미등록'}</div>
                            <div>📧 <strong>이메일:</strong> {m.email}</div>
                            <div>🏠 <strong>주소:</strong> {m.address}</div>
                          </div>

                          {/* Completed Sessions Adjustment Controls */}
                          <div style={{ background: '#0F172A', padding: '10px 14px', borderRadius: '8px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                            <span style={{ color: '#FFF', fontSize: '0.88rem', fontWeight: 'bold' }}>
                              🎓 훈련 수료 횟수: <span style={{ color: '#34D399', fontSize: '1.1rem' }}>{m.completedSessions}회</span>
                            </span>
                            <div style={{ display: 'flex', gap: '6px', alignItems: 'center' }}>
                              <button
                                type="button"
                                className="btn btn-secondary btn-sm"
                                style={{ padding: '2px 8px' }}
                                onClick={() => handleUpdateCompletedSessions(m.id, -1)}
                              >
                                - 1회
                              </button>
                              <button
                                type="button"
                                className="btn btn-primary btn-sm"
                                style={{ padding: '2px 8px' }}
                                onClick={() => handleUpdateCompletedSessions(m.id, 1)}
                              >
                                + 1회 수료 추가
                              </button>
                            </div>
                          </div>

                          {/* Editable Memo */}
                          <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                            <input
                              type="text"
                              defaultValue={m.memo}
                              id={`memo-input-${m.id}`}
                              placeholder="관리자 특이사항 메모 입력..."
                              style={{ flex: 1, padding: '8px 10px', background: '#0F172A', border: '1px solid var(--border-color)', color: '#94A3B8', borderRadius: '6px', fontSize: '0.82rem' }}
                            />
                            <button
                              type="button"
                              className="btn btn-secondary btn-sm"
                              onClick={() => {
                                const inputEl = document.getElementById(`memo-input-${m.id}`);
                                if (inputEl) handleSaveMemberMemo(m.id, inputEl.value);
                              }}
                            >
                              메모저장
                            </button>
                            <button
                              type="button"
                              className="btn btn-sm"
                              style={{ background: 'rgba(239, 68, 68, 0.2)', color: '#F87171', border: 'none' }}
                              onClick={() => handleDeleteMember(m.id, m.name)}
                            >
                              삭제
                            </button>
                          </div>
                        </div>
                      );
                    })}
                </div>
              </div>
            </div>
          )}

          {/* Discreet Footer Link */}
          <footer style={{ textAlign: 'center', padding: '20px 0 90px 0', color: 'var(--text-muted)', fontSize: '0.78rem' }}>
            © 2026 도담 (DODAM) 1:1 방문훈련 & 펫케어 서비스 · 
            <span
              style={{ cursor: 'pointer', marginLeft: '6px', opacity: 0.5, textDecoration: 'underline' }}
              onClick={handleAdminAccessClick}
              title="관리자 접속 (비밀번호: 4865)"
            >
              {isAdminMode ? '⚙️ [관리자 수정 ON (클릭시 해제)]' : '🔒 관리자'}
            </span>
          </footer>

          {/* Bottom Nav */}
          <nav className="bottom-nav">
            <button className={`b-tab ${activeTab === 'home' ? 'active' : ''}`} onClick={() => setActiveTab('home')}>🏠 홈</button>
            <button className={`b-tab ${activeTab === 'booking' ? 'active' : ''}`} onClick={() => setActiveTab('booking')}>📅 예약달력</button>
            <button className={`b-tab ${activeTab === 'qna' ? 'active' : ''}`} onClick={() => setActiveTab('qna')}>❓ 질문란</button>
            <button className={`b-tab ${activeTab === 'photoboard' ? 'active' : ''}`} onClick={() => setActiveTab('photoboard')}>📸 포토</button>
            <button className={`b-tab ${activeTab === 'profile' ? 'active' : ''}`} onClick={() => setActiveTab('profile')}>🐶 내 강아지</button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
